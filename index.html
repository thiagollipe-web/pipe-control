/* =====================================================

   ===================================================== */

function rng(seed){

    let x =
        seed >>> 0;

    return function(){

        x +=
            0x6D2B79F5;

        let t = x;

        t =
            Math.imul(
                t ^ t >>> 15,
                t | 1
            );

        t ^=

            t +

            Math.imul(
                t ^ t >>> 7,
                t | 61
            );

        return (

            (
                (t ^ t >>> 14)
                >>> 0
            )
            / 4294967296
        );
    };
}


/* =====================================================
   TIPOS DE CANOS

const CANOS = {

    "|-":{

const TIPOS =

/* =====================================================
   ÁUDIO
   ===================================================== */

let audio = null;

function iniciarAudio(){

    if(!audio){

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(AudioContext){

            audio =
                new AudioContext();
        }
    }

    if(
        audio &&
        audio.state === "suspended"
    ){

        audio.resume();
    }
}

function beep(
    frequencia,
    duracao = .08,
    tipo = "square"
){

    iniciarAudio();

    if(!audio)
        return;

    const osc =
        audio.createOscillator();

    const gain =
        audio.createGain();

    osc.type =
        tipo;

    osc.frequency.value =
        frequencia;

    gain.gain.setValueAtTime(
        .07,
        audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audio.currentTime +
        duracao
    );

    osc.connect(gain);

    gain.connect(
        audio.destination
    );

    osc.start();

    osc.stop(
        audio.currentTime +
        duracao
    );
}

function som(tipo){

    if(tipo === "click"){

        beep(
            600,
            .05
        );

        return;
    }

    if(tipo === "rotate"){

        beep(
            760,
            .045
        );

        return;
    }

    if(tipo === "win"){

        beep(
            523,
            .08
        );

        setTimeout(
            () =>
                beep(
                    659,
                    .08
                ),
            80
        );

        setTimeout(
            () =>
                beep(
                    784,
                    .15
                ),
            160
        );

        return;
    }

    if(tipo === "lose"){

        beep(
            150,
            .3
        );

        return;
    }

    if(tipo === "final"){

        const notas = [
            523,
            587,
            659,
            698,
            783,
            880,
            987,
            1046
        ];

        notas.forEach(
            (nota,i)=>{

                setTimeout(
                    () =>
                        beep(
                            nota,
                            .1
                        ),
                    i*100
                );
            }
        );
    }
}


/* =====================================================

   ===================================================== */

function dificuldade(f){

    if(f <= 100)
        return "FÁCIL";

    if(f <= 250)
        return "NORMAL";

    if(f <= 500)
        return "DIFÍCIL";

    if(f <= 750)
        return "MUITO DIFÍCIL";

    if(f <= 900)
        return "EXTREMA";

    if(f <= 999)
        return "LENDÁRIA";

    return "DESAFIO FINAL";
}


/* =====================================================
   TEMPO
   ===================================================== */

function calcularTempo(f){

    if(f <= 100)
        return 60;

    if(f <= 250)
        return 55;

    if(f <= 500)
        return 48;

    if(f <= 750)
        return 42;

    if(f <= 900)
        return 36;

    if(f <= 999)
        return 30;

    return 45;
}


/* =====================================================
   LAYOUT
   ===================================================== */

function resize(){

    W =
        window.innerWidth;

    H =
        window.innerHeight;


    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvas.width =
        Math.floor(
            W*dpr
        );

    canvas.height =
        Math.floor(
            H*dpr
        );


    canvas.style.width =
        W+"px";

    canvas.style.height =
        H+"px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    /*
       Reservamos espaço:

       topo
       tabuleiro
       comandos
    */

    const largura =
        Math.min(
            W-20,
            620
        );

    const altura =
        Math.min(
            H-220,
            620
        );


    cell =
        Math.min(
            largura/8,
            altura/8
        );


    offsetX =
        (W -
        cell*8) / 2;


    offsetY =
        Math.max(
            145,
            (H -
            cell*8) / 2
        );
}
